name: Renovate

on:
  push:
    branches:
      - main
      - deps
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  queue: max

jobs:
  dependency-rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/dependency-rollup
        with:
          refresh-lockfile: 'false'
